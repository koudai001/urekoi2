# Cloudflare Workers (Wrangler) のビルド・テスト実行に必要なパッケージの許可リスト
onlyBuiltDependencies:
  # バンドル
  - esbuild
  # シュミレータ
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
packages:
  - "apps/*"
  - "packages/*"
# Expo SDK が求める版に揃える
catalog:
  react: 19.3.0
  react-dom: 19.3.0
peerDependencyRules:
  allowedVersions:
    drizzle-orm>@sinclair/typebox: "*"
